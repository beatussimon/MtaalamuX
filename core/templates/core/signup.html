{% extends 'core/base.html' %}
{% load crispy_forms_tags %}
{% block title %}Sign Up{% endblock %}
{% block content %}
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">
        <h1 class="display-6 fw-bold">Sign Up</h1>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-user-plus"></i> Sign Up</button>
        </form>
        <p class="text-center mt-3">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    </div>
{% endblock %}

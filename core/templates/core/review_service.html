{% extends 'core/base.html' %}
{% load crispy_forms_tags %}
{% block title %}Review {{ professional.user.username }}{% endblock %}
{% block content %}
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 600px;">
        <h1 class="display-6 fw-bold">Review {{ professional.field }} Service</h1>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-star"></i> Submit Review</button>
        </form>
    </div>
{% endblock %}

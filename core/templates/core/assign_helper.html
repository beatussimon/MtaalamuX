{% extends 'core/base.html' %}
{% load static %}
{% block title %}Assign Helper{% endblock %}
{% block content %}
    <div class="container my-5">
        <h1 class="fw-bold mb-4">Assign Helper</h1>
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_user" class="form-label">User</label>
                        <select name="user" id="id_user" class="form-control" required>
                            <option value="">Select a user</option>
                            {% for user in users %}
                                <option value="{{ user.id }}">{{ user.username }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="id_task" class="form-label">Task</label>
                        <select name="task" id="id_task" class="form-control" required>
                            <option value="">Select a task</option>
                            {% for task_value, task_name in helper_tasks %}
                                <option value="{{ task_value }}">{{ task_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Assign</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
